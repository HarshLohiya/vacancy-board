# ---------------------------------------------------------------------------
# Vacancy Tracker - source configuration
# Edit this file to add, remove or correct any source. Nothing else needs
# changing. Run `python -m src.main --check-urls` after editing.
# ---------------------------------------------------------------------------

settings:
  # Alert when a deadline is this many days away or less.
  closing_soon_days: 7
  # Keep an item on the dashboard this many days after its deadline passes.
  keep_expired_days: 3
  # Timezone used for "days left" arithmetic and the timestamp on the board.
  timezone: "Asia/Kolkata"
  # If true, PESB rows are filtered to railway-sector CPSEs only (below).
  # Set to false to receive every board-level CPSE vacancy PESB advertises.
  railway_cpse_only: true

# Posts you care about. Matching is case-insensitive on the post title.
# Word-boundary matched, so "MD" will not fire on "AMD" or "Comdt".
post_keywords:
  - "chairman"
  - "managing director"
  - "CMD"
  - "MD"
  - "director"
  - "executive director"
  - "ED"
  - "project director"
  - "PD"
  - "general manager"
  - "GM"
  - "CGM"
  - "chief general manager"
  - "group general manager"
  - "chief project manager"
  - "CPM"
  - "chief engineer"
  - "principal chief"

# Organisations treated as railway sector for the PESB filter.
railway_cpse_match:
  - "rail"
  - "ircon"
  - "rites"
  - "concor"
  - "container corporation"
  - "irctc"
  - "irfc"
  - "dfccil"
  - "dedicated freight"
  - "konkan"
  - "braithwaite"
  - "burn standard"
  - "bharat wagon"
  - "wagon"
  - "metro"

# ---------------------------------------------------------------------------
# STRUCTURED SOURCES - parsed into named posts with real deadline dates.
# ---------------------------------------------------------------------------
structured:
  - id: pesb_advertised
    name: "PESB - Advertised Vacancies"
    url: "https://pesb.gov.in/Home/AdvertisVacancy"
    parser: pesb_table
    kind: advertised

  # PESB withdrew its Upcoming Vacancies page in 2026 - the address below
  # answers 302 -> /Error/Error, and the site's menu now offers only
  # Advertised Vacancies and Vacancies Archive. Confirmed in a browser on
  # 2 Aug 2026; it is not a scraping problem.
  #
  # What this costs: the board's "Upcoming vacancies" section, which only
  # ever came from here, stays empty. Advertised rows still show the date a
  # post falls vacant ("Vacant from ..."), but a post PESB has not yet
  # advertised is no longer visible anywhere - that early warning is gone
  # until they restore the page.
  #
  # If the page comes back, uncomment this and nothing else needs changing.
  # - id: pesb_upcoming
  #   name: "PESB - Upcoming Vacancies"
  #   url: "https://pesb.gov.in/Advertisement/UpcomingVacancyDetailsForAll"
  #   parser: pesb_table
  #   kind: upcoming

# ---------------------------------------------------------------------------
